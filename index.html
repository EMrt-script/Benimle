
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nesrin ❤️</title>
<style>
body {
  margin:0; min-height:100vh; display:flex;
  align-items:center; justify-content:center;
  background:linear-gradient(135deg,#ffe0eb,#ffb6cc);
  font-family:Arial,sans-serif; text-align:center;
  color:#8b1747;
}
.card {
  background:white; padding:35px 22px;
  border-radius:25px; width:85%;
  max-width:400px; box-shadow:0 10px 35px #d8799b55;
}
h1 {font-size:35px}
p {font-size:20px;line-height:1.5}
button {
  border:0; border-radius:30px; padding:14px 22px;
  margin:8px; font-size:17px; font-weight:bold;
  cursor:pointer; transition:transform .2s;
}
#yes {background:#ed397b;color:white}
#no {background:#ffe1eb;color:#9d315b}
#result {font-size:23px;font-weight:bold;margin-top:22px}
</style>
</head>
<body>
<div class="card">
<div style="font-size:48px">💗</div>
<h1>Nesrin ❤️</h1>
<p>Sana küçük bir sorum var...<br>
<strong>Benimle çıkar mısın?</strong></p>
<div id="buttons">
<button id="yes">EVET ❤️</button>
<button id="no">HAYIR 🥺</button>
</div>
<div id="result"></div>
</div>
<script>
let step=0;
let scale=1;
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const result=document.getElementById("result");

yes.onclick=()=>{
  if(step===0){
    step=1;
    result.textContent="Emin misin, beni sevebilecek misin? ❤️";
    yes.textContent="EVET, EMİNİM ❤️";
  } else {
    document.getElementById("buttons").style.display="none";
    result.textContent="Yuppiiiiii Seviyorum seni 🤍🤍";
    for(let i=0;i<35;i++){
      setTimeout(()=>{
        let h=document.createElement("div");
        h.textContent="🤍";
        h.style.cssText="position:fixed;left:"+Math.random()*100+"%;bottom:-30px;font-size:30px;animation:up 3s linear forwards";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),3000);
      },i*100);
    }
  }
};
no.onclick=()=>{
  scale=Math.max(.08,scale*.7);
  no.style.transform="scale("+scale+")";
  if(scale<.2) no.textContent="🥺";
};
</script>
<style>
@keyframes up {to{transform:translateY(-110vh);opacity:0}}
</style>
</body>
</html>
